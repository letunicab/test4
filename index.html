<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag to Rotate Cube</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            overflow: hidden;
            user-select: none; /* Prevents text selection while dragging */
        }

        .scene {
            width: 200px;
            height: 200px;
            perspective: 1000px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            cursor: grab;
        }

        .cube:active {
            cursor: grabbing;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 40px;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        /* Face positions */
        .front  { transform: rotateY(0deg) translateZ(100px); background: rgba(255, 0, 0, 0.4); }
        .back   { transform: rotateY(180deg) translateZ(100px); background: rgba(0, 255, 0, 0.4); }
        .right  { transform: rotateY(90deg) translateZ(100px); background: rgba(0, 0, 255, 0.4); }
        .left   { transform: rotateY(-90deg) translateZ(100px); background: rgba(255, 255, 0, 0.4); }
        .top    { transform: rotateX(90deg) translateZ(100px); background: rgba(255, 0, 255, 0.4); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); background: rgba(0, 255, 255, 0.4); }
    </style>
</head>
<body>

    <div class="scene">
        <div class="cube" id="cube">
            <div class="face front">1</div>
            <div class="face back">2</div>
            <div class="face right">3</div>
            <div class="face left">4</div>
            <div class="face top">5</div>
            <div class="face bottom">6</div>
        </div>
    </div>

    <script>
       const cube = document.getElementById('cube');
let isDragging = false;
let currentX = 0;
let currentY = 0;
let velocityX = 0;
let velocityY = 0;
let lastMouseX = 0;
let lastMouseY = 0;

// Friction: 0.95 means it loses 5% of its speed every frame
const friction = 0.95;

function update() {
    if (!isDragging) {
        // Apply friction to the velocity
        velocityX *= friction;
        velocityY *= friction;

        // Apply velocity to the rotation
        currentX += velocityY;
        currentY += velocityX;

        // Stop the loop if movement is negligible to save performance
        if (Math.abs(velocityX) > 0.01 || Math.abs(velocityY) > 0.01) {
            cube.style.transform = `rotateX(${-currentX}deg) rotateY(${currentY}deg)`;
        }
    }
    
    requestAnimationFrame(update);
}

window.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    // Calculate how fast the mouse moved since the last frame
    velocityX = (e.clientX - lastMouseX) * 0.5;
    velocityY = (e.clientY - lastMouseY) * 0.5;

    currentY += velocityX;
    currentX += velocityY;

    cube.style.transform = `rotateX(${-currentX}deg) rotateY(${currentY}deg)`;

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

// Start the animation loop
update();

    </script>
</body>
</html>
